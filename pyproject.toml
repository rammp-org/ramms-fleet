[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ramms-fleet"
version = "0.1.0"
description = "Federated learning experiments on simulated RAMMS rover fleets"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "flwr>=1.30,<2",
    "mujoco>=3.3.0",
    "numpy>=1.24.0",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
video = ["imageio>=2.30", "imageio-ffmpeg>=0.5", "pillow>=10"]
ramms = ["pyzmq>=25", "msgpack>=1.0"]

[project.scripts]
ramms-fleet-collect = "ramms_fleet.collect:main"
ramms-fleet-view = "ramms_fleet.view:main"
ramms-fleet-baseline = "ramms_fleet.experiment:baseline_main"
ramms-fleet-eval = "ramms_fleet.experiment:eval_main"
ramms-fleet-federate = "ramms_fleet.federate:main"
ramms-fleet-sweep = "ramms_fleet.sweep:main"
ramms-fleet-compare = "ramms_fleet.sweep:compare_main"
ramms-fleet-render = "ramms_fleet.render:main"
ramms-fleet-guard = "ramms_fleet.guard:main"
ramms-fleet-guard-summary = "ramms_fleet.guard:summary_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ramms_fleet = ["assets/*.xml"]

[tool.flwr.app]
publisher = "rammp-org"

[tool.flwr.app.components]
serverapp = "ramms_fleet.fl.server_app:app"
clientapp = "ramms_fleet.fl.client_app:app"

# Defaults; ramms-fleet-federate overrides these per run.
[tool.flwr.app.config]
num-rovers = 8
num-server-rounds = 20
local-epochs = 1
lr = 0.001
hidden = 64
history = 4
proximal-mu = 0.0
evaluate-every = 1
label = "time"
horizon-m = 0.15
inputs = "features"
seed = 0
results-dir = "results/federated"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses are safe as argument defaults.
extend-immutable-calls = [
  "ramms_fleet.world.ArenaLayout",
  "ramms_fleet.spec.RoverParams",
  "ramms_fleet.spec.WanderParams",
  "ramms_fleet.crowd.CrowdParams",
  "ramms_fleet.guard.GuardParams",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
